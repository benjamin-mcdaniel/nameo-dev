name = "nameo-worker"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://nameo.dev"

# Secrets (set via `wrangler secret put <NAME>`):
#   CLERK_SECRET_KEY        — Clerk backend secret key
#   CLERK_PUBLISHABLE_KEY   — Clerk publishable key (used for JWKS issuer)
#   STRIPE_SECRET_KEY       — Stripe secret key
#   STRIPE_WEBHOOK_SECRET   — Stripe webhook signing secret

[[d1_databases]]
binding = "DB"
database_name = "nameo-db"
database_id = "4afe937a-4c9b-4cb1-bfad-64d8844ca26e"

[[durable_objects.bindings]]
name = "COLLECTOR"
class_name = "NameCollector"
script_name = "nameo-collector"
