name = "nameo-worker"
main = "backend/worker/src/index.js"
compatibility_date = "2024-01-01"

[vars]
AUTH0_DOMAIN = "dev-17f30x2uvmivb8or.us.auth0.com"
AUTH0_AUDIENCE = "https://nameo-api"
ORCHESTRATOR_URL = "https://nameo-search-worker.benjamin-f-mcdaniel.workers.dev"

# ── Public (unauthenticated) rate limits ──────────────────────────────────────
# Per-IP and global daily caps on /api/check and /api/suggestions
RATE_LIMIT_DAILY_GLOBAL = "5000"
RATE_LIMIT_DAILY_IP     = "100"

# ── Authenticated user rate limits ────────────────────────────────────────────
# Max sessions a single user can create per day
RATE_LIMIT_USER_SESSIONS = "20"
# Max report runs a single user can trigger per day
RATE_LIMIT_USER_REPORTS  = "100"

# ── Secrets (set via `wrangler secret put <NAME>`) ────────────────────────────
# ORCHESTRATOR_TOKEN  — auth token for the search orchestrator
# ANTHROPIC_API_KEY   — Claude API key for name generation
# NTFY_TOPIC          — ntfy.sh topic for operator push alerts (nameo-prod-alerts-7x4k)

[[services]]
binding = "SEARCH_ORCHESTRATOR"
service = "nameo-search-worker"

[[d1_databases]]
binding = "NAMEO_DB"                # used in Worker env.NAMEO_DB
database_name = "nameo-db"          # D1 database name in Cloudflare dashboard
database_id = "4afe937a-4c9b-4cb1-bfad-64d8844ca26e"
